# Môi trường dev đầy đủ: PostgreSQL + MinIO (kho tệp). Chạy: docker compose up -d   (hoặc: make services)
# Sau đó đặt trong app/.env:
#   DATABASE_URL=postgresql://educonnect:educonnect@localhost:5432/educonnect
#   DIRECT_URL=postgresql://educonnect:educonnect@localhost:5432/educonnect
#   STORAGE_PROVIDER=minio  MINIO_ENDPOINT=http://localhost:9000  MINIO_ACCESS_KEY=educonnect  MINIO_SECRET_KEY=educonnect-secret  MINIO_BUCKET=educonnect
# CHỈ DÙNG CHO MÁY DEV: mật khẩu mặc định, cổng mở ra máy chủ. Production dùng dịch vụ có quản lý (Supabase/RDS...) và khoá bí mật riêng.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: educonnect
      POSTGRES_PASSWORD: educonnect
      POSTGRES_DB: educonnect
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U educonnect"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Bật pg_stat_statements để xem truy vấn chậm nhất: SELECT query, calls, mean_exec_time FROM pg_stat_statements ORDER BY mean_exec_time DESC LIMIT 10;
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "log_min_duration_statement=500"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: educonnect
      MINIO_ROOT_PASSWORD: educonnect-secret
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 educonnect educonnect-secret &&
      mc mb --ignore-existing local/educonnect && mc anonymous set none local/educonnect"
    restart: "no"

volumes:
  pgdata:
  miniodata:
